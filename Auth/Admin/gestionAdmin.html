<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafétéria Teccart | Gestion du Menu (Admin)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Navigation Admin -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="#" class="flex items-center gap-3 group">
                    <div class="bg-purple-600 text-white p-2 rounded-xl shadow-md">
                        <i class="fa-solid fa-user-shield text-xl"></i>
                    </div>
                    <span class="font-extrabold text-xl text-slate-900 tracking-tight">
                        Teccart <span class="text-purple-600">Espace Admin</span>
                    </span>
                </a>
                <div class="hidden md:flex items-center gap-8 font-medium text-sm text-slate-600">
                    <a href="/Auth/Admin/commandesAdmin.html" class="hover:text-purple-600 transition-colors py-1">Commandes</a>
                    <a href="/Auth/Admin/gestionAdmin.html" class="text-purple-600 font-semibold border-b-2 border-purple-600 py-1">Gestion des Repas & Stock</a>
                </div>
                <div>
                    <a href="/Login.html" class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-xl transition-colors text-sm">
                        <span>Déconnexion</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Application Vue Admin -->
    <div id="app" class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">Gestion du Menu et des Stocks</h1>
            <p class="text-slate-600 font-medium">Modifiez les détails des repas et la quantité disponible en temps réel</p>
        </header>

        <!-- Liste des produits modifiables -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div v-for="(product, index) in productsList" :key="product.id" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
                
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-mono bg-slate-100 px-2.5 py-1 rounded-full font-bold">#{{ product.productNumber }}</span>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" :class="product.stock > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'">
                            Stock : {{ product.stock ?? 10 }}
                        </span>
                    </div>

                    <!-- Formulaire d'édition du produit -->
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Nom du repas</label>
                            <input type="text" v-model="product.productName" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Description</label>
                            <textarea v-model="product.productDesc" rows="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-medium"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Prix ($)</label>
                                <input type="number" step="0.01" v-model.number="product.productPrice" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Quantité / Stock</label>
                                <input type="number" v-model.number="product.stock" min="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-medium">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bouton Enregistrer les modifications de la carte -->
                <button @click="sauvegarderProduit(index)" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl text-xs transition-colors shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Enregistrer les modifications</span>
                </button>
            </div>
        </div>

        <!-- Toast de Notification -->
        <div v-if="showToast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700">
            <div class="w-8 h-8 bg-purple-500 text-white rounded-full flex items-center justify-center shrink-0">
                <i class="fa-solid fa-check text-sm"></i>
            </div>
            <p class="font-bold text-sm">{{ toastMessage }}</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-slate-500">
            <p>© <span id="year"></span> Caféteria Teccart</p>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const app = Vue.createApp({
            data() {
                return {
                    productsList: [],
                    showToast: false,
                    toastMessage: ''
                };
            },
            mounted() {
                this.chargerProduits();
            },
            methods: {
                chargerProduits() {
                    const produitsStorage = localStorage.getItem("produits");
                    if (produitsStorage) {
                        this.productsList = JSON.parse(produitsStorage).map(p => ({
                            ...p,
                            stock: p.stock !== undefined ? p.stock : 10 // Valeur par défaut de stock si absent
                        }));
                    }
                },
                sauvegarderProduit(index) {
                    // Enregistre les modifications (prix, description, stock) apportées par l'admin
                    localStorage.setItem("produits", JSON.stringify(this.productsList));
                    this.toast("Modifications enregistrées avec succès !");
                },
                toast(message) {
                    this.toastMessage = message;
                    this.showToast = true;
                    setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        });
        app.mount("#app");
    </script>
</body>
</html>
